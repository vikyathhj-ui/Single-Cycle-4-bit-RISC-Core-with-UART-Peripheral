; RISCOF configuration (docs/BRIEF.md A5, D-003, D-013). Run from the repo root:
;   make riscof   (builds sim_build/tb_arch/tb_arch, then runs riscof in .venv-riscof)
[RISCOF]
ReferencePlugin=spike_ref
ReferencePluginPath=riscof/spike_ref
DUTPlugin=lp_rv32
DUTPluginPath=riscof/lp_rv32

[lp_rv32]
pluginpath=riscof/lp_rv32
ispec=riscof/lp_rv32/lp_rv32_isa.yaml
pspec=riscof/lp_rv32/lp_rv32_platform.yaml
PATH=sim_build/tb_arch
jobs=6
target_run=1

[spike_ref]
pluginpath=riscof/spike_ref
jobs=6
