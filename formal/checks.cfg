# riscv-formal configuration for lp_rv32_core (docs/MICROARCH.md §10).
# Options and sections follow ext/riscv-formal/docs/source/procedure.rst and the example
# ext/riscv-formal/cores/nerv/checks.cfg. scripts/run_formal.py replaces @core_files@ with the
# absolute paths from rtl/core/core.f and copies this file into ext/riscv-formal/cores/lp_rv32/.
#
# Notes (docs/DECISIONS.md D-010):
# - solver yices: the only SMT solver installed (D-002).
# - reg is 14, not 20: depth 16 and 18 did not finish within 30 min and depth 20 not within 2 h
#   (results/formal/probe_reg*.log, D-012).
# - misa is not exposed over RVFI: riscv-formal's Zbb models treat misa bit 1 ("B") as "Zbb
#   present", but this core keeps B = 0 as the ratified privileged spec requires (S-3).
# - [csrs] lists only CSRs whose every bit is writable: the csrw check requires each bit an
#   instruction sets/clears to be stored. WARL CSRs (mstatus, mie, mtvec, mepc, mcause) are
#   verified by the arch tests and simulation instead.

[options]
isa rv32iZbb
nret 1
solver yices

[depth]
insn            20
reg        5    14
pc_fwd     5    20
pc_bwd     5    20
unique     1  5 20
causal     5    20
liveness   1  5 25
cover      1    20
ill             20
csrw            20
csr_ill         20
csrc_upcnt 1    15

[csrs]
mscratch
mtval
mcycle          upcnt
minstret        upcnt

[illegal_csrs]
302     m       rw
303     m       rw
306     m       rw
30a     m       rw
320     m       rw
3a0     m       rw
7b0     m       rw
180     m       rw
c00     m       rw
f11     m       w

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[defines liveness]
`define LP_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[script-sources]
plugin -i slang
read_slang -D RISCV_FORMAL --top lp_rv32_core @core_files@

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
